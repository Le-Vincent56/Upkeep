[package]
name = "upkeep"
version = "0.1.0"
description = "Upkeep: MTG deck and collection tracker"
edition = "2024"
rust-version = "1.90"

[lib]
name = "upkeep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12" }

[dev-dependencies]
serde_json = "1.0"
